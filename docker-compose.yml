services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iolaus_dev
      POSTGRES_USER: iolaus
      POSTGRES_PASSWORD: iolaus
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iolaus -d iolaus_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
