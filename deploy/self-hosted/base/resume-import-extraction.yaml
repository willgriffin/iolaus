apiVersion: v1
kind: Service
metadata:
  name: iolaus-resume-import-extraction
  labels:
    app.kubernetes.io/name: iolaus
    app.kubernetes.io/component: resume-import-extraction
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iolaus
    app.kubernetes.io/component: resume-import-extraction
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iolaus-resume-import-extraction
  labels:
    app.kubernetes.io/name: iolaus
    app.kubernetes.io/component: resume-import-extraction
    app.kubernetes.io/part-of: iolaus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iolaus
      app.kubernetes.io/component: resume-import-extraction
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iolaus
        app.kubernetes.io/component: resume-import-extraction
        app.kubernetes.io/part-of: iolaus
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: iolaus-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: extractor
          image: ghcr.io/willgriffin/iolaus/resume-import-extraction@sha256:REPLACE_WITH_RELEASED_IMAGE_DIGEST
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: http } }
          livenessProbe: { httpGet: { path: /health, port: http } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: extraction-tmp, mountPath: /tmp }]
      volumes:
        - name: extraction-tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iolaus-resume-import-extraction
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iolaus
      app.kubernetes.io/component: resume-import-extraction
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iolaus
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [web, task-worker, schedule-worker]
      ports: [{ protocol: TCP, port: 8080 }]
  egress: []
