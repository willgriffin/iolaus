apiVersion: batch/v1
kind: CronJob
metadata:
  name: iolaus-queue-provider-monitor
  labels:
    app.kubernetes.io/name: iolaus
    app.kubernetes.io/component: queue-provider-monitor
    app.kubernetes.io/part-of: iolaus
spec:
  # The job is intentionally read-only. Alert on failed jobs and inspect its
  # count-only JSON output; it is independent of the web process and probes.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iolaus
            app.kubernetes.io/component: queue-provider-monitor
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: iolaus-registry
          containers:
            - name: monitor
              image: ghcr.io/willgriffin/iolaus/site@sha256:REPLACE_WITH_RELEASED_IMAGE_DIGEST
              command: ["pnpm", "--filter", "@willgriffin/iolaus-site", "deployment:monitor"]
              envFrom:
                - secretRef:
                    name: iolaus-runtime
              env:
                - name: NODE_ENV
                  value: production
                - name: SMRT_RUNTIME_PROFILE
                  value: self-hosted
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
