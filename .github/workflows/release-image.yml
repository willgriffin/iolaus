---
name: Release image
'on':
  # Publishing a release is the single automatic trigger; a tag push would
  # race it and publish a second, different digest for the same tag.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
permissions: {}
concurrency:
  group: >-
    release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/willgriffin/iolaus/site
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write is needed only to append the digest to release notes.
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Resolve source revision and lockfile digest
        id: meta
        run: |
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "lock_sha256=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push site image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          build-args: |
            IOLAUS_SOURCE_REVISION=${{ steps.meta.outputs.revision }}
            IOLAUS_LOCKFILE_SHA256=${{ steps.meta.outputs.lock_sha256 }}
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected digest: ${DIGEST}" >&2
            exit 1
          fi
          ref="${IMAGE}@${DIGEST}"
          {
            echo "### Released site image"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Source revision: \`${REVISION}\`"
            echo "- Immutable reference: \`${ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json body --jq .body > notes.md; then
            echo "::notice::No release for ${RELEASE_TAG};" \
              "digest recorded in job summary only."
            exit 0
          fi
          if grep -Fq "${ref}" notes.md; then
            exit 0
          fi
          {
            echo
            echo "## Container image"
            echo
            echo "Pin deploy overlays to this immutable reference:"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
          } >> notes.md
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --notes-file notes.md
