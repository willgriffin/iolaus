name: Validate
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: azure/setup-kubectl@v4
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm format-check && pnpm lint && pnpm check && pnpm test && pnpm
          build && pnpm knowledge:check
  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_REVISION: >-
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.sha || github.sha }}
    services:
      postgres-image-cache:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Verify host network isolation prerequisite
        run: scripts/ci/prepare-parity-isolation.sh
      - name: Install native build diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb
      - name: Build exact candidate image without publishing
        run: |
          lock_sha256="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          scripts/ci/candidate-build-watchdog.sh -- \
            docker build --progress=plain --load \
            --file apps/site/Dockerfile \
            --build-arg "IOLAUS_SOURCE_REVISION=${CANDIDATE_REVISION}" \
            --build-arg "IOLAUS_LOCKFILE_SHA256=${lock_sha256}" \
            --tag iolaus-parity-candidate:ci .
      - name: Verify immutable candidate parity
        run: |
          image_id="$(
            docker image inspect --format '{{.Id}}' \
              iolaus-parity-candidate:ci
          )"
          node scripts/deployed-parity.mjs \
            --local-image-id "${image_id}" \
            --evidence .omo/evidence/issue-32/ci-candidate-contract.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const candidate = JSON.parse(
            readFileSync('.omo/evidence/issue-32/ci-candidate-contract.json'),
          );
          const provenance = candidate.executionProvenance;
          const topology = candidate.checks?.find(
            (check) => check.id === 'self-hosted-topology',
          );
          if (
            candidate.status !== 'passed' ||
            candidate.candidateImageTested !== true ||
            candidate.revision !== process.env.CANDIDATE_REVISION ||
            candidate.syntheticDataOnly !== true ||
            candidate.productionAccessPerformed !== false ||
            candidate.releaseEligible !== false ||
            candidate.candidateImageProvenance?.binding !== 'local-image-id' ||
            provenance?.deploymentEvidenceRequiredForRelease !== true ||
            !provenance?.candidateImageScenarioIds?.includes(
              'generated-surfaces',
            ) ||
            !provenance?.hostOnlyScenarioIds?.includes(
              'self-hosted-topology',
            ) ||
            topology?.execution?.kind !== 'host' ||
            candidate.secretValuesIncluded !== false
          ) {
            throw new Error('Candidate evidence did not fail closed.');
          }
          EOF
      - name: Qualify immutable candidate cold-root OIDC runtime
        env:
          HOSTED_OIDC_POSTGRES_TEST_DATABASE_URL: >-
            postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          image_id="$(
            docker image inspect --format '{{.Id}}' \
              iolaus-parity-candidate:ci
          )"
          runtime_tmpfs="rw,nosuid,nodev,uid=10001,gid=10001"
          cache_tmpfs="size=64m,${runtime_tmpfs}"
          docker run --rm --network host \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,uid=0,gid=0,mode=1777 \
            --tmpfs \
            /app/apps/site/node_modules/.vite-temp:"${cache_tmpfs}" \
            --tmpfs /app/apps/site/node_modules/.vite:"${cache_tmpfs}" \
            --tmpfs /app/apps/site/.svelte-kit:"size=256m,${runtime_tmpfs}" \
            --tmpfs /app/.smrt:"${cache_tmpfs}" \
            --tmpfs /app/apps/site/.smrt:"${cache_tmpfs}" \
            --tmpfs /app/apps/site/src/types:"size=16m,${runtime_tmpfs}" \
            --env CI=true --env NODE_ENV=test \
            --env SMRT_RUNTIME_PROFILE=local \
            --env HOME=/tmp/home --env TMPDIR=/tmp \
            --env XDG_CONFIG_HOME=/tmp/config \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            --env pnpm_config_verify_deps_before_run=false \
            --env HOSTED_OIDC_POSTGRES_TEST_DATABASE_URL \
            --entrypoint /usr/bin/env "${image_id}" \
            pnpm --filter @willgriffin/iolaus-site exec vitest run \
            src/lib/server/hosted-oidc-provisioning.integration.spec.ts
      - name: Upload secret-free candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iolaus-candidate-parity-${{ env.CANDIDATE_REVISION }}
          path: .omo/evidence/issue-32/ci-candidate-contract.json
          include-hidden-files: true
          if-no-files-found: error
