packages:
  - apps/*
  - packages/*

# Existing specialty dependency and advisory pins.
overrides:
  "@happyvertical/spider": "1.1.11"
  "@happyvertical/pdf": "0.66.0"
  "@happyvertical/ocr": "0.62.1"
  "@happyvertical/animation": "0.5.0"
  sharp: "0.35.5"

  # Bounded advisory remediation; preserve each existing major line.
  "pdfjs-dist@6": "6.2.108"
  "proxy-addr@2": "2.0.8"
  "undici@8": "8.10.2"
  "undici@7": "7.29.1"
  "axios@1": "1.20.0"
  "follow-redirects@1": "1.16.1"
  "fast-uri@3": "3.1.7"
  "ip-address@10": "10.3.1"
  "nanoid@3": "3.3.18"
  "http-cache-semantics@4": "4.3.0"
  "brace-expansion@2": "2.1.6"
  "brace-expansion@5": "5.0.11"
  "postcss@8": "8.5.18"
  "source-map-js@1": "1.2.2"
  "browserslist@4": "4.28.7"
  "figlet@1": "1.11.3"
  "vite@8": "8.1.6"

# pnpm 11 reads these settings from pnpm-workspace.yaml; the `pnpm.*` fields in
# package.json (overrides, onlyBuiltDependencies) are no longer honored.
#
onlyBuiltDependencies:
  - '@duckdb/node-api'
  - esbuild
  - lefthook
  - sqlite-vss

# pnpm 11 gates dependency build scripts via this allowBuilds map and fails
# (ERR_PNPM_IGNORED_BUILDS) on no-op installs unless every build-script package
# has an explicit decision. true = run install scripts (kept from the pnpm 10
# onlyBuiltDependencies list); false = intentionally skip (were ignored before).
allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  # OCR engine pulled in transitively by @happyvertical/pdf; we only use its
  # renderHtmlToPdf/extraction APIs, never OCR, so skip the build script.
  tesseract.js: false

# Allow freshly-published first-party @happyvertical packages through any
# minimum-release-age policy (the coordinated closure deliberately pins its
# qualified published versions).
minimumReleaseAgeExclude:
  - '@happyvertical/ai'
  - '@happyvertical/auth'
  - '@happyvertical/cache'
  - '@happyvertical/files'
  - '@happyvertical/geo'
  - '@happyvertical/jobs'
